description = 'Public, stable API contract for LederProtections integrations.'

def spigotApiVersion = providers.gradleProperty('spigotApiVersion').getOrElse('1.21.1-R0.1-SNAPSHOT')

dependencies {
    compileOnlyApi("org.spigotmc:spigot-api:${spigotApiVersion}")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifactId = 'lederprotections-api'

            pom {
                name = 'LederProtections API'
                description = project.description
                url = 'https://github.com/Alexisleder/LederAPI'

                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'Alexisleder'
                        name = 'Alexisleder'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/Alexisleder/LederAPI.git'
                    developerConnection = 'scm:git:ssh://github.com/Alexisleder/LederAPI.git'
                    url = 'https://github.com/Alexisleder/LederAPI'
                }
            }
        }
    }
}
